
services:
  db-pedidos:
    image: postgres:15-alpine
    container_name: db-pedidos
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_PEDIDOS_NAME}
    ports:
      - "5432:5432"
    volumes:
      - vol_pedidos_data:/var/lib/postgresql/data
    networks:
      - red-logistica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_PEDIDOS_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-drones:
    image: postgres:15-alpine
    container_name: db-drones
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_DRONES_NAME}
    ports:
      - "5433:5432"
    volumes:
      - vol_drones_data:/var/lib/postgresql/data
    networks:
      - red-logistica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_DRONES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-despachador:
    image: postgres:15-alpine
    container_name: db-despachador
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_DESPACHADOR_NAME}
    ports:
      - "5434:5432"
    volumes:
      - vol_despachador_data:/var/lib/postgresql/data
    networks:
      - red-logistica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_DESPACHADOR_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  red-logistica:
    driver: bridge
    name: red-logistica

volumes:
  vol_pedidos_data:
  vol_drones_data:
  vol_despachador_data:
  